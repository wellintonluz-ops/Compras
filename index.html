<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta DANFE - API Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Consulta DANFE</h1>
            <p class="text-slate-600 font-medium tracking-tight">Sistema de Recuperação de XML e PDF</p>
        </div>

        <div class="glass p-8 rounded-2xl shadow-xl">
            <div class="space-y-4">
                <div>
                    <label for="chave" class="block text-sm font-semibold text-slate-700 mb-1">Chave de Acesso (44 dígitos)</label>
                    <input 
                        type="text" 
                        id="chave" 
                        maxlength="44"
                        placeholder="0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000"
                        class="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-mono text-lg transition-all"
                        value="35260444823938000187551090000002691092067649"
                    >
                </div>

                <button 
                    onclick="executarConsulta()" 
                    id="btn-consultar"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg transition-all flex items-center justify-center gap-2 group"
                >
                    <span id="btn-text">Consultar Documento</span>
                    <div id="loader" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
                </button>
            </div>

            <!-- Status Box -->
            <div id="status-box" class="hidden mt-6 p-4 rounded-lg text-sm flex items-start gap-3 border">
                <div id="status-icon" class="mt-0.5"></div>
                <div>
                    <p id="status-title" class="font-bold"></p>
                    <p id="status-message" class="text-xs mt-1"></p>
                </div>
            </div>

            <!-- Download Area -->
            <div id="results" class="hidden mt-8 border-t pt-6 animate-pulse-once">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="baixarArquivo('pdf')" class="flex flex-col items-center p-5 bg-white border border-slate-200 rounded-xl hover:border-red-300 hover:bg-red-50 transition-all group">
                        <div class="bg-red-100 p-3 rounded-full text-red-600 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
                        </div>
                        <span class="mt-2 text-red-700 font-bold">PDF (DANFE)</span>
                    </button>

                    <button onclick="baixarArquivo('xml')" class="flex flex-col items-center p-5 bg-white border border-slate-200 rounded-xl hover:border-blue-300 hover:bg-blue-50 transition-all group">
                        <div class="bg-blue-100 p-3 rounded-full text-blue-600 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        </div>
                        <span class="mt-2 text-blue-700 font-bold">Arquivo XML</span>
                    </button>
                </div>
            </div>
        </div>
        
        <p class="text-center text-[10px] text-slate-400 mt-6 uppercase tracking-widest">
            Uso técnico para desenvolvedores • Sujeito a restrições de CORS
        </p>
    </div>

    <script>
        let dadosDocumento = null;

        async function executarConsulta() {
            const chave = document.getElementById('chave').value.replace(/\D/g, '');
            const btn = document.getElementById('btn-consultar');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');

            if (chave.length !== 44) {
                exibirStatus("Erro de Validação", "A chave deve ter 44 dígitos.", "error");
                return;
            }

            // UI Feedback
            btn.disabled = true;
            loader.classList.remove('hidden');
            results.classList.add('hidden');
            exibirStatus("Conectando...", "Aguardando resposta da API...", "info");

            try {
                // Tentativa 1: Direta (Pode falhar por CORS)
                // Tentativa 2: Via Proxy (Fallback automático)
                let data = await chamarAPI(chave, false);
                
                if (!data || data.error) {
                    console.log("Chamada direta falhou ou bloqueada. Tentando via Proxy...");
                    data = await chamarAPI(chave, true);
                }

                if (data && (data.xml_base64 || data.pdf_base64)) {
                    dadosDocumento = data;
                    results.classList.remove('hidden');
                    exibirStatus("Sucesso!", "Documento recuperado com êxito.", "success");
                } else {
                    throw new Error("Dados não encontrados para esta chave.");
                }

            } catch (err) {
                console.error(err);
                exibirStatus("Falha na Integração", "Não foi possível acessar a API. Isso geralmente ocorre devido a restrições de segurança do navegador (CORS).", "error");
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        async function chamarAPI(chave, usarProxy) {
            let url = 'https://consultadanfe.com/api/v1/consulta';
            
            if (usarProxy) {
                // Proxy AllOrigins para contornar CORS no GitHub Pages
                url = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            }

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chave: chave })
            });

            if (!response.ok) return null;
            return await response.json();
        }

        function exibirStatus(titulo, msg, tipo) {
            const box = document.getElementById('status-box');
            const t = document.getElementById('status-title');
            const m = document.getElementById('status-message');
            const icon = document.getElementById('status-icon');

            box.className = `mt-6 p-4 rounded-xl text-sm flex items-start gap-3 border transition-all ${
                tipo === 'error' ? 'bg-red-50 border-red-100 text-red-800' : 
                tipo === 'success' ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 
                'bg-blue-50 border-blue-100 text-blue-800'
            }`;

            t.innerText = titulo;
            m.innerText = msg;
            box.classList.remove('hidden');

            icon.innerHTML = tipo === 'error' ? '❌' : tipo === 'success' ? '✅' : '⏳';
        }

        function baixarArquivo(ext) {
            if (!dadosDocumento) return;
            const base64 = ext === 'pdf' ? dadosDocumento.pdf_base64 : dadosDocumento.xml_base64;
            const mime = ext === 'pdf' ? 'application/pdf' : 'text/xml';
            
            if (!base64) {
                alert("Este formato não está disponível para esta nota.");
                return;
            }

            const link = document.createElement('a');
            link.href = `data:${mime};base64,${base64}`;
            link.download = `${dadosDocumento.chave || 'nota'}.${ext}`;
            link.click();
        }

        // Limitar apenas números no input
        document.getElementById('chave').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
